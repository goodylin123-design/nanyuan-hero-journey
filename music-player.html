<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="英雄之旅@南園主題曲尚未收錄">
    <title>英雄主題音樂 - 英雄之旅@南園</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .music-player-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .music-player-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            border: 2px solid rgba(56, 189, 248, 0.2);
            text-align: center;
            margin-bottom: 30px;
        }
        
        .music-title {
            font-size: 2rem;
            color: #0F172A;
            margin-bottom: 10px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        @media (max-width: 768px) {
            .music-title {
                font-size: 1.5rem;
                white-space: normal;
                word-break: keep-all;
                line-height: 1.3;
            }
            
            .music-player-card {
                padding: 25px 15px;
            }
            
            .music-controls {
                flex-direction: column;
                gap: 15px;
            }
            
            .btn-music {
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }
        }
        
        .music-subtitle {
            color: #64748B;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .music-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .btn-music {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-play {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        
        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
        
        .music-info {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(14, 165, 233, 0.05));
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .music-info h3 {
            color: #0F172A;
            margin-bottom: 15px;
        }
        
        .music-info-item {
            margin-bottom: 10px;
            color: #475569;
        }
        
        .music-info-label {
            font-weight: 600;
            color: #3B82F6;
            display: inline-block;
            width: 120px;
        }
        
        .music-elements {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(56, 189, 248, 0.2);
        }
        
        .music-elements h3 {
            color: #0F172A;
            margin-bottom: 15px;
        }
        
        .music-elements ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .music-elements li {
            padding: 10px 0;
            color: #475569;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
        }
        
        .music-elements li:last-child {
            border-bottom: none;
        }
        
        .music-elements li::before {
            content: '🎵 ';
            margin-right: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            background: #EF4444;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-indicator.playing {
            background: #10B981;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div class="ocean-background" aria-hidden="true">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
    </div>
    
    <div class="coastline" aria-hidden="true">
        <div class="dune dune-front"></div>
        <div class="dune dune-mid"></div>
        <div class="dune dune-back"></div>
        <div class="coastline-highlight"></div>
    </div>
    
    <div class="container">
        <!-- 語言選擇器 -->
        <div class="language-selector" id="language-selector">
            <button type="button" class="lang-toggle-btn" id="lang-toggle-btn" aria-label="選擇語言">
                <span class="lang-icon">🌐</span>
                <span class="lang-current" id="lang-current">繁體中文</span>
                <span class="lang-arrow">▼</span>
            </button>
            <div class="lang-dropdown" id="lang-dropdown" style="display: none;">
                <button type="button" class="lang-option" data-lang="zh-TW">繁體中文</button>
                <button type="button" class="lang-option" data-lang="zh-CN">简体中文</button>
                <button type="button" class="lang-option" data-lang="en">English</button>
                <button type="button" class="lang-option" data-lang="ja">日本語</button>
                <button type="button" class="lang-option" data-lang="ko">한국어</button>
            </div>
        </div>
        
        <header class="header">
            <a href="app.html" class="back-link" data-i18n="backToHome">← 返回英雄之旅首頁</a>
            <h1 class="title" data-i18n="musicPlayerTitle">🎵 英雄主題音樂</h1>
            <p class="subtitle" data-i18n="musicPlayerSubtitle">南園主題曲尚未收錄</p>
        </header>
        
        <main class="content">
            <div class="music-player-container">
                <section class="music-player-card">
                    <h2 class="music-title" data-i18n="musicTitle">《南園・英雄之旅》</h2>
                    <p class="music-subtitle" data-i18n="musicSubtitle">曲子準備好之後，會從這一頁播放。</p>
                    <p style="color:#475569;line-height:1.7;margin:16px 0 0;">南園主題曲還沒有收進這個網站。這一頁先不播放其他園區的歌。</p>
                </section>
                
                <section class="card" style="margin-top: 30px;">
                    <h3 data-i18n="aboutSong">💡 關於這首歌</h3>
                    <p style="color: #475569; line-height: 1.7;" data-i18n="aboutSongDesc">
                        南園主題曲還沒有收進這個網站。這一頁先不播放其他園區的歌，也不顯示那份歌詞。
                    </p>
                    <p style="color: #475569; line-height: 1.7; margin-top: 15px;" data-i18n="aboutSongDesc2">
                        曲子收錄之後，會從這一頁播放。
                    </p>
                    <p style="color: #64748B; margin-top: 15px; font-size: 0.9rem;" data-i18n="musicTip">
                        目前沒有可播放的音檔。
                    </p>
                </section>
            </div>
        </main>
    </div>
    
    <script>
        let audio = null;
        let isPlaying = false;
        // #region agent log
        var __dbgLastAction = 'none';
        var __dbgLastTimeSec = -1;
        function __dbg(hypothesisId, location, message, data) {
            fetch('http://127.0.0.1:7566/ingest/7fb020dc-8142-4413-8358-5bafc5e85e90',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'9e510f'},body:JSON.stringify({sessionId:'9e510f',runId:'pre-fix',hypothesisId:hypothesisId,location:location,message:message,data:data||{},timestamp:Date.now()})}).catch(function(){});
        }
        window.addEventListener('error', function(e) {
            __dbg('D','music-player.html:window.error','uncaught error',{msg:String(e.message||e),filename:e.filename,lineno:e.lineno,innerWidth:window.innerWidth});
        });
        window.addEventListener('unhandledrejection', function(e) {
            __dbg('D','music-player.html:unhandledrejection','unhandledrejection',{reason:String(e.reason)});
        });
        // #endregion

        document.addEventListener('DOMContentLoaded', () => {
            // 與其他子頁面一致：返回連結用絕對網址，避免手機瀏覽器解析錯誤
            var back = document.querySelector('.back-link');
            if (back && back.getAttribute('href') === 'app.html') {
                back.href = new URL('app.html', window.location.href).href;
            }

            audio = document.getElementById('hero-music-audio');
            const btnPlay = document.getElementById('btn-play-music');
            const btnStop = document.getElementById('btn-stop-music');
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            const volumeControl = document.getElementById('volume-control');
            const volumeValue = document.getElementById('volume-value');

            if (!audio) return;

            audio.volume = 0.7;
            volumeControl.value = 70;

            // #region agent log
            (function logInit() {
                var br = back ? back.getBoundingClientRect() : null;
                var cx = br ? br.left + br.width / 2 : 0;
                var cy = br ? br.top + br.height / 2 : 0;
                var topEl = (br && document.elementFromPoint(cx, cy)) ? document.elementFromPoint(cx, cy) : null;
                var srcEl = audio.querySelector('source');
                __dbg('C','music-player.html:init','page init',{
                    innerWidth: window.innerWidth,
                    innerHeight: window.innerHeight,
                    ua: navigator.userAgent,
                    hrefAttr: back ? back.getAttribute('href') : null,
                    hrefResolved: back ? back.href : null,
                    backRect: br ? {x:br.x,y:br.y,w:br.width,h:br.height} : null,
                    topElAtBack: topEl ? (topEl.tagName + '#' + (topEl.id||'') + '.' + (topEl.className||'')) : null,
                    audioSrc: audio.currentSrc || (srcEl && srcEl.getAttribute('src')),
                    sourceSrc: srcEl ? srcEl.getAttribute('src') : null
                });
            })();
            if (back) {
                function logBack(ev) {
                    var br = back.getBoundingClientRect();
                    var cx = br.left + br.width / 2;
                    var cy = br.top + br.height / 2;
                    var topEl = document.elementFromPoint(cx, cy);
                    __dbg('E','music-player.html:back','back-link event',{
                        type: ev.type,
                        defaultPrevented: ev.defaultPrevented,
                        href: back.href,
                        target: ev.target && (ev.target.tagName + '.' + (ev.target.className||'')),
                        topElAtCenter: topEl ? (topEl.tagName + '#' + (topEl.id||'') + '.' + (topEl.className||'')) : null,
                        isPlaying: isPlaying,
                        audioPaused: audio.paused,
                        currentTime: audio.currentTime
                    });
                }
                back.addEventListener('click', logBack, true);
                back.addEventListener('touchend', logBack, true);
            }
            // #endregion

            volumeControl.addEventListener('input', (e) => {
                audio.volume = parseInt(e.target.value) / 100;
                volumeValue.textContent = e.target.value + '%';
            });

            btnPlay.addEventListener('click', () => {
                if (audio && !isPlaying) {
                    // #region agent log
                    __dbgLastAction = 'play-click';
                    __dbg('B','music-player.html:play-click','user clicked play',{readyState:audio.readyState,networkState:audio.networkState,currentSrc:audio.currentSrc,paused:audio.paused});
                    // #endregion
                    audio.play().then(() => {
                        statusText.textContent = '正在播放...';
                        statusIndicator.classList.add('playing');
                        btnPlay.style.display = 'none';
                        btnStop.style.display = 'flex';
                        isPlaying = true;
                    }).catch((err) => {
                        console.error('播放失敗:', err);
                        statusText.textContent = '播放失敗，請再試一次';
                        // #region agent log
                        __dbg('A','music-player.html:play-catch','play() rejected',{name:err&&err.name,msg:String(err)});
                        // #endregion
                    });
                }
            });

            btnStop.addEventListener('click', () => {
                if (audio && isPlaying) {
                    // #region agent log
                    __dbgLastAction = 'stop-click';
                    __dbg('B','music-player.html:stop-click','user clicked stop',{currentTime:audio.currentTime});
                    // #endregion
                    audio.pause();
                    audio.currentTime = 0;
                    statusText.textContent = '已停止';
                    statusIndicator.classList.remove('playing');
                    btnPlay.style.display = 'flex';
                    btnStop.style.display = 'none';
                    isPlaying = false;
                }
            });

            audio.addEventListener('play', () => {
                statusText.textContent = '正在播放...';
                statusIndicator.classList.add('playing');
                btnPlay.style.display = 'none';
                btnStop.style.display = 'flex';
                isPlaying = true;
            });
            audio.addEventListener('pause', () => {
                statusText.textContent = '已暫停';
                statusIndicator.classList.remove('playing');
                btnPlay.style.display = 'flex';
                btnStop.style.display = 'none';
                isPlaying = false;
                // #region agent log
                __dbg('B','music-player.html:pause','audio pause event',{lastAction:__dbgLastAction,currentTime:audio.currentTime,ended:audio.ended,readyState:audio.readyState,networkState:audio.networkState,paused:audio.paused});
                // #endregion
            });
            audio.addEventListener('ended', () => {
                statusText.textContent = '播放完成';
                statusIndicator.classList.remove('playing');
                btnPlay.style.display = 'flex';
                btnStop.style.display = 'none';
                isPlaying = false;
                // #region agent log
                __dbg('B','music-player.html:ended','audio ended',{currentTime:audio.currentTime,loop:audio.loop,duration:audio.duration});
                // #endregion
            });
            audio.addEventListener('error', (e) => {
                console.error('音訊錯誤:', e);
                statusText.textContent = '音樂載入失敗';
                // #region agent log
                var mediaErr = audio.error;
                __dbg('A','music-player.html:error','audio error',{code:mediaErr&&mediaErr.code,message:mediaErr&&mediaErr.message,currentSrc:audio.currentSrc,networkState:audio.networkState,readyState:audio.readyState,currentTime:audio.currentTime});
                // #endregion
            });
            // #region agent log
            audio.addEventListener('loadedmetadata', function() {
                __dbg('A','music-player.html:loadedmetadata','metadata',{duration:audio.duration,currentSrc:audio.currentSrc,readyState:audio.readyState});
            });
            audio.addEventListener('stalled', function() {
                __dbg('A','music-player.html:stalled','stalled',{currentTime:audio.currentTime,readyState:audio.readyState,networkState:audio.networkState});
            });
            audio.addEventListener('waiting', function() {
                __dbg('A','music-player.html:waiting','waiting/buffering',{currentTime:audio.currentTime,readyState:audio.readyState,networkState:audio.networkState});
            });
            audio.addEventListener('timeupdate', function() {
                var sec = Math.floor(audio.currentTime);
                if (sec !== __dbgLastTimeSec && sec % 2 === 0) {
                    __dbgLastTimeSec = sec;
                    __dbg('A','music-player.html:timeupdate','playback progress',{currentTime:audio.currentTime,paused:audio.paused,readyState:audio.readyState,networkState:audio.networkState,buffered:audio.buffered.length?audio.buffered.end(audio.buffered.length-1):0});
                }
            });
            // #endregion
        });
    </script>
    <script src="i18n.js"></script>
    <script src="index-i18n.js"></script>
</body>
</html>
